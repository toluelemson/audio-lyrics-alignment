[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-lyrics-alignment"
version = "0.1.0"
description = "Real-time worship audio-to-lyrics alignment engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "sounddevice>=0.4.7,<1",
  "onnxruntime>=1.18,<2",
  "python-osc>=1.9,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
lyrics-aligner = "lyrics_aligner.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lyrics_aligner"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=lyrics_aligner --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lyrics_aligner"]
